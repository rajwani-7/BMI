{% extends "base.html" %}

{% block title %}Profile - HealthCompanion{% endblock %}

{% block content %}
<div class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <h2>⚡ HEALTHCOMPANION</h2>
        </div>
        <div class="navbar-menu">
            <a href="{{ url_for('dashboard') }}" class="nav-btn"><span>DASHBOARD</span></a>
            <a href="{{ url_for('profile') }}" class="nav-btn active"><span>PROFILE</span></a>
            <a href="{{ url_for('diet') }}" class="nav-btn"><span>DIET PLAN</span></a>
            <a href="{{ url_for('analytics') }}" class="nav-btn"><span>ANALYTICS</span></a>
            <a href="{{ url_for('notifications') }}" class="nav-btn"><span>ALERTS</span></a>
            <a href="{{ url_for('logout') }}" class="nav-btn logout-btn"><span>LOGOUT</span></a>
        </div>
    </div>
</div>

<div class="container dashboard-container">
    <div class="section-header">
        <h2>HEALTH PROFILE</h2>
        <p>Configure your biometric data</p>
    </div>

    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="age">AGE</label>
                    <input type="number" id="age" name="age" min="1" max="150" 
                           value="{{ profile.age if profile else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="gender">GENDER</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male" {% if profile and profile.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if profile and profile.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if profile and profile.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="height">HEIGHT (cm)</label>
                    <input type="number" id="height" name="height" min="100" max="250" step="0.1" 
                           value="{{ profile.height if profile else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="weight">WEIGHT (kg)</label>
                    <input type="number" id="weight" name="weight" min="20" max="300" step="0.1" 
                           value="{{ profile.weight if profile else '' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="activity_level">ACTIVITY LEVEL</label>
                    <select id="activity_level" name="activity_level" required>
                        <option value="">Select Activity Level</option>
                        <option value="Low" {% if profile and profile.activity_level == 'Low' %}selected{% endif %}>Low (Sedentary)</option>
                        <option value="Medium" {% if profile and profile.activity_level == 'Medium' %}selected{% endif %}>Medium (Moderate)</option>
                        <option value="High" {% if profile and profile.activity_level == 'High' %}selected{% endif %}>High (Very Active)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sleep_hours">SLEEP HOURS</label>
                    <input type="number" id="sleep_hours" name="sleep_hours" min="0" max="24" step="0.5" 
                           value="{{ profile.sleep_hours if profile else '' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="water_intake">WATER INTAKE (glasses/day)</label>
                    <input type="number" id="water_intake" name="water_intake" min="0" max="20" 
                           value="{{ profile.water_intake if profile else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="diet_preference">DIET PREFERENCE</label>
                    <select id="diet_preference" name="diet_preference" required>
                        <option value="">Select Preference</option>
                        <option value="Veg" {% if profile and profile.diet_preference == 'Veg' %}selected{% endif %}>Vegetarian</option>
                        <option value="Non-Veg" {% if profile and profile.diet_preference == 'Non-Veg' %}selected{% endif %}>Non-Vegetarian</option>
                        <option value="Vegan" {% if profile and profile.diet_preference == 'Vegan' %}selected{% endif %}>Vegan</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>MEDICAL CONDITIONS</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="conditions" value="Diabetes"
                               {% if profile and profile.medical_conditions and 'Diabetes' in profile.medical_conditions %}checked{% endif %}>
                        <span>Diabetes</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="conditions" value="BP"
                               {% if profile and profile.medical_conditions and 'BP' in profile.medical_conditions %}checked{% endif %}>
                        <span>High Blood Pressure</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="conditions" value="Thyroid"
                               {% if profile and profile.medical_conditions and 'Thyroid' in profile.medical_conditions %}checked{% endif %}>
                        <span>Thyroid Disorder</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="conditions" value="Cholesterol"
                               {% if profile and profile.medical_conditions and 'Cholesterol' in profile.medical_conditions %}checked{% endif %}>
                        <span>High Cholesterol</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="goal">FITNESS GOAL</label>
                <select id="goal" name="goal" required>
                    <option value="">Select Goal</option>
                    <option value="Lose Weight" {% if profile and profile.goal == 'Lose Weight' %}selected{% endif %}>Lose Weight</option>
                    <option value="Gain Weight" {% if profile and profile.goal == 'Gain Weight' %}selected{% endif %}>Gain Weight</option>
                    <option value="Maintain Weight" {% if profile and profile.goal == 'Maintain Weight' %}selected{% endif %}>Maintain Weight</option>
                    <option value="Improve Fitness" {% if profile and profile.goal == 'Improve Fitness' %}selected{% endif %}>Improve Fitness</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">SAVE PROFILE</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-block" style="margin-top: 15px;">BACK TO DASHBOARD</a>
        </form>
    </div>
</div>
{% endblock %}
